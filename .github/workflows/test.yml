name: Node tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: airwatch_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEST_MYSQL: '1'
      TEST_MYSQL_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test


  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.2.2'
      - name: Install supported board and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.0.7 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "WiFiManager@2.0.17" "Adafruit AHTX0@2.0.6" "SparkFun Indoor Air Quality Sensor - ENS160@1.1.0" "PMS Library@1.1.0"
      - name: Compile complete ESP32 firmware
        run: |
          mkdir -p build/firmware
          cp firmware.ino sensor_filter.h connection_config.h tls_roots.h build/firmware/
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build/output build/firmware
      - uses: actions/upload-artifact@v4
        with:
          name: AirWatch-ESP32-firmware
          path: build/output/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t airwatch-test .
      - name: Validate reverse proxy configuration
        run: docker run --rm -e DOMAIN=airwatch.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start isolated deployment and verify automatic setup
        run: |
          python3 - <<'PY'
          import base64, pathlib
          values = dict(DOMAIN='airwatch.example.com', DB_HOST='db', DB_NAME='smart_air_db', DB_USER='airwatch', DB_PASSWORD='smoke-database-password', MYSQL_ROOT_PASSWORD='smoke-root-password', JWT_SECRET='smoke-only-secret-at-least-32-characters-long', ADMIN_USERNAME='smoke-admin', ADMIN_EMAIL='smoke@example.invalid', ADMIN_PASSWORD_B64=base64.b64encode(b'smoke-private-password').decode())
          pathlib.Path('.env.cloud').write_text('\n'.join(k+'='+v for k,v in values.items())+'\n')
          pathlib.Path('/tmp/airwatch-ci.yaml').write_text('services:\n  app:\n    ports: ["127.0.0.1:3000:3000"]\n')
          PY
          docker compose --env-file .env.cloud -f compose.yaml -f /tmp/airwatch-ci.yaml up -d --build --wait app
          node scripts/smoke.cjs
          docker compose --env-file .env.cloud -f compose.yaml -f /tmp/airwatch-ci.yaml restart app
          docker compose --env-file .env.cloud -f compose.yaml -f /tmp/airwatch-ci.yaml up -d --wait app
          node scripts/smoke.cjs
      - name: Stop isolated stack
        if: always()
        run: docker compose --env-file .env.cloud -f compose.yaml -f /tmp/airwatch-ci.yaml down -v
